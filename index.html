  <style>
    @media print {
      body { background-color: #ffffff !important; color: #1e293b !important; }
      .no-print { display: none !important; }
      thead { display: table-header-group !important; }
      tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      .table-container { max-height: none !important; overflow: visible !important; border: none !important; }
    }

    /* 自訂捲軸樣式 - 粉橘粉紅適配 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #fff1f2;
    }
    ::-webkit-scrollbar-thumb {
      background: #fecdd3;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #fda4af;
    }

    .table-container {
      max-height: calc(100vh - 270px);
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
    }

    /* 表頭固定且實心粉橘背景，防止向下滾動時文字穿透重疊 */
    .sticky-header th {
      position: sticky !important;
      top: 0 !important;
      z-index: 25 !important;
      background-color: #ffe4e6 !important;
      color: #881337 !important;
      box-shadow: 0 1px 3px 0 rgba(244, 63, 94, 0.08);
    }
    
    /* 總表隊別底色 - 溫暖粉橘粉紅家族適配 */
    .bg-team-white { background-color: #ffffff; }
    .bg-team-red { background-color: #ffe4e6; }
    .bg-team-green { background-color: #ffedd5; } /* 原綠改為溫潤粉橙 */
    .bg-team-successor { background-color: #fef3c7; }

    /* 活動流程階層項目符號樣式 (粉橘粉紅版) */
    .bullet-level-1 {
      position: relative;
      padding-left: 1.3rem;
      margin-bottom: 0.35rem;
    }
    .bullet-level-1::before {
      content: "•";
      position: absolute;
      left: 0.25rem;
      top: -0.05rem;
      font-weight: bold;
      color: #f43f5e;
      font-size: 1.15rem;
    }

    .bullet-level-2 {
      position: relative;
      padding-left: 2.1rem;
      margin-bottom: 0.35rem;
    }
    .bullet-level-2::before {
      content: "◦";
      position: absolute;
      left: 1.1rem;
      top: -0.05rem;
      font-weight: bold;
      color: #fb7185;
      font-size: 1.15rem;
    }

    .bullet-level-3 {
      position: relative;
      padding-left: 2.9rem;
      margin-bottom: 0.35rem;
    }
    .bullet-level-3::before {
      content: "▪";
      position: absolute;
      left: 1.95rem;
      top: 0.1rem;
      font-size: 0.85rem;
      color: #f97316;
    }

    }

      box-shadow: 0 20px 25px -5px rgba(244, 63, 94, 0.15), 0 8px 10px -6px rgba(244, 63, 94, 0.1);
    }

    /* 住宿房間圖卡：純 CSS / SVG，無新增外部套件。 */
    .room-view {padding:24px;background:#fff8f5;}
    .room-toolbar {display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;}
    .room-toolbar button {background:white;border:1px solid #fecdd3;border-radius:20px;padding:7px 14px;color:#9f1239;font-size:13px;cursor:pointer;}
    .room-help {color:#9f6674;font-size:13px;margin:0 0 20px;}
    .hotel-section + .hotel-section {margin-top:30px;}
    .hotel-title {font-size:20px;font-weight:800;color:#881337;margin:0 0 16px;display:flex;align-items:center;gap:10px;}
    .hotel-title small {font-size:12px;font-weight:500;color:#9f6674;}
    .rooms-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;}
    .room-card {position:relative;min-width:0;background:#fff;border:1px solid #fecdd3;border-radius:20px;padding:16px 16px 0;box-shadow:0 5px 16px #88133709;outline:none;cursor:pointer;transition:box-shadow .2s,transform .2s;}
    .room-card:hover,.room-card:focus-visible {box-shadow:0 10px 25px #88133718;transform:translateY(-3px);}
    .room-card:focus-visible {outline:3px solid #fb7185;outline-offset:3px;}
    .room-sign {display:flex;justify-content:space-between;align-items:center;gap:8px;color:#881337;font-weight:800;font-size:14px;margin-bottom:12px;}
    .room-sign span {font-size:12px;background:#fff1f2;padding:4px 9px;border-radius:10px;white-space:nowrap;}
    .room-facade {position:relative;background:linear-gradient(135deg,#ffe4e6,#fff1e6);border:2px solid #fecdd3;border-bottom:6px solid #fda4af;border-radius:14px 14px 0 0;min-height:230px;padding:18px 12px 12px;}
    .room-card.hotel-orange .room-facade {background:linear-gradient(135deg,#ffedd5,#fff7ed);border-color:#fed7aa;border-bottom-color:#fdba74;}
    .room-group-label {font-size:11px;text-align:center;color:#9f6674;letter-spacing:1px;margin-bottom:15px;}
    .room-door-area {display:flex;gap:12px;align-items:flex-start;justify-content:center;}
    .room-door {width:76px;min-width:76px;height:150px;border:5px solid #bb7c68;border-bottom:0;border-radius:36px 36px 0 0;background:repeating-linear-gradient(90deg,#d99c80 0,#d99c80 17px,#d29174 18px,#d29174 19px);position:relative;}
    .room-door:after {content:'';position:absolute;width:9px;height:9px;background:#fde68a;border:2px solid #b77939;border-radius:50%;right:8px;top:85px;}
    .room-door-window {margin:14px auto;width:36px;height:34px;background:#fff8e7;border:3px solid #bb7c68;border-radius:18px 18px 4px 4px;}
    .room-roster {flex:1;min-width:0;background:#fffdf8;transform:rotate(2deg);border:1px solid #efd8c1;box-shadow:2px 3px 0 #88133709;border-radius:4px;padding:10px 9px;position:relative;}
    .room-roster:before {content:'';position:absolute;width:35px;height:12px;background:#fcd8ada0;left:calc(50% - 17px);top:-6px;transform:rotate(-5deg);}
    .room-roster-title {font-size:11px;color:#9f6674;border-bottom:1px dashed #e7c5b8;padding-bottom:5px;margin-bottom:5px;}
    .room-roster ul {list-style:none;padding:0;margin:0;}
    .room-roster li {font-size:13px;line-height:1.7;color:#713f3f;overflow-wrap:anywhere;}
    .room-roster li.matched {font-weight:800;color:#be123c;}
    .room-roster .contact {font-size:10px;color:#be123c;display:block;line-height:1.3;}
    .room-people {display:flex;justify-content:center;flex-wrap:wrap;gap:0;min-height:68px;padding-top:2px;position:relative;}
    .room-person {width:48px;height:64px;opacity:0;transform:translateY(15px) scale(.7);transition:opacity .2s,transform .3s;transition-delay:calc(var(--person-index) * 45ms);}
    .room-card:hover .room-person,.room-card:focus .room-person,.room-card.is-open .room-person {opacity:1;transform:translateY(0) scale(1);}
    .room-hand {transform-box:fill-box;transform-origin:15% 85%;}
    .room-card:hover .room-hand,.room-card:focus .room-hand,.room-card.is-open .room-hand {animation:room-wave .55s ease-in-out infinite alternate;animation-delay:calc(var(--person-index) * 70ms);}
    @keyframes room-wave {from{transform:rotate(-12deg)}to{transform:rotate(22deg)}}
    .room-foot {font-size:11px;color:#9f6674;text-align:center;padding:9px 0 12px;}
    .room-empty {padding:40px;text-align:center;color:#9f6674;}
    @media(max-width:540px){.room-view{padding:15px}.rooms-grid{grid-template-columns:1fr}.room-facade{min-height:210px}.hotel-title{font-size:18px}}
    @media(prefers-reduced-motion:reduce){.room-card,.room-person{transition:none}.room-hand{animation:none!important}}
    @media print {.room-view{padding:0;background:white}.room-toolbar,.room-help{display:none}.rooms-grid{grid-template-columns:repeat(2,1fr)}.room-card{break-inside:avoid;box-shadow:none}.room-people{display:none}.room-card{transform:none!important}}
  </style>

    function updateTimestampDisplay() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('updateTimestamp').textContent = `${yy}'${mm}${dd}-${hh}${min}`;
    }

    async function fetchCloudDataSilently() {
      if (cloudRefreshInProgress) return;
      cloudRefreshInProgress = true;
      let dataChanged = false;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      
      try {

        // 同時非同步抓取「成員名單」與指定路徑之「活動流程 (gid=1928975316)」
        const [dirRes, scheduleRes] = await Promise.allSettled([
          fetch(`${GOOGLE_SHEET_DIR_URL}&_t=${Date.now()}`, { signal: controller.signal, cache: 'no-store' }).then(async response => ({ ok: response.ok, csv: response.ok ? await response.text() : '' })),
          fetch(`${GOOGLE_SHEET_SCHEDULE_URL}&_t=${Date.now()}`, { signal: controller.signal, cache: 'no-store' }).then(async response => ({ ok: response.ok, csv: response.ok ? await response.text() : '' }))
        ]);


        // 1. 解析指定來源的重啟活動流程 (gid=1928975316)
        if (scheduleRes.status === 'fulfilled' && scheduleRes.value.ok) {
          const scheduleCsv = scheduleRes.value.csv;
          Papa.parse(scheduleCsv, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                const parsedSchedule = results.data.map((r, idx) => {
                  const dateVal = r['日期'] || r['Date'] || '';
                  const actVal = r['活動'] || r['活動內容'] || r['流程項目'] || r['Activity'] || '';
                  const noteVal = r['說明'] || r['備註'] || r['注意事項'] || r['Note'] || '';

                  // 起時智慧辨識：支援「起時」、「開始時間」、「起時(時間)」、「Start」、「時間」或複合時間欄位擷取
                  let startVal = r['起時'] || r['開始時間'] || r['Start'] || r['起'] || '';
                  let endVal = r['迄時'] || r['結束時間'] || r['End'] || r['迄'] || '';

                  // 若單一「時間」欄包含區間（如 09:00-10:00 或 09:00~10:00）
                  const fullTime = r['時間'] || r['時段'] || r['Time'] || '';
                  if (!startVal && fullTime) {
                    const match = fullTime.match(/(\d{1,2}:\d{2})/g);
                    if (match && match.length > 0) {
                      startVal = match[0];
                      if (!endVal && match.length > 1) endVal = match[1];
                    } else {
                      startVal = fullTime;
                    }
                  }

                  return {
                    id: idx + 1,
                    date: dateVal,
                    startTime: startVal || '',
                    endTime: endVal || '',
                    duration: r['時長'] || r['時間(分)'] || r['Duration'] || '',
                    location: r['地點'] || r['場地'] || r['Location'] || '',
                    activity: actVal,
                    note: noteVal
                  };
                }).filter(item => item.date || item.activity);

                if (parsedSchedule.length > 0) {
                  if (JSON.stringify(scheduleData) !== JSON.stringify(parsedSchedule)) {
                    scheduleData = parsedSchedule;
                    dataChanged = true;
                  }
                }
              }
            }
          });
        }

        // 2. 解析成員總表
        if (dirRes.status === 'fulfilled' && dirRes.value.ok) {
          const csvText = dirRes.value.csv;
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                const parsed = results.data.map(r => {
                  const name = r['姓名'] || '';
                  let rest = r['餐廳'] || '';
                  if (name === '吳佩容') rest = 'NO';

                  return {
                    team: r['隊別'] || '',
                    name: name,
                    trafficOut: r['交通-去程'] || '',
                    trafficBack: r['交通-回程'] || '',
                    isTrafficLeader: (r['交通-去程_隊長'] === '交通-去程_隊長' || r['交通-去程_隊長'] === '隊長') ? '是' : '否',
                    restaurant: rest,
                    isDiningLeader: (r['餐廳_隊長'] && r['餐廳_隊長'].includes('隊長')) ? '是' : '否',
                    diet: r['飲食注意事項'] || '無',
                    hotel: r['住宿'] || '',
                    roomType: r['房型'] || '',
                    roomGroup: r['住宿-房型-分組'] || r['房間分組'] || '',
                    roommates: r['室友'] || ''
                  };
                }).filter(i => i.name);

                if (parsed.length > 0) {
                  const previousData = JSON.stringify(rawDirectoryData);
                  rawDirectoryData = parsed;
                  calculateDirectoryRoommates();
                  if (JSON.stringify(rawDirectoryData) !== previousData) dataChanged = true;
                }
              }
            }
          });
        }
      } catch (err) {
        console.warn('雲端更新連線略過，維持原始數據集');
      } finally {
        clearTimeout(timeoutId);
        cloudRefreshInProgress = false;
        refreshIcon.classList.remove('fa-spin');
        if (dataChanged) renderCurrentTab();
      }
    }

    function manualRefreshData() {
      updateTimestampDisplay();
      fetchCloudDataSilently();
    }

    /* =========================================================
       3. 室友關聯演算
       ========================================================= */
    function calculateDirectoryRoommates() {
      searchTextCache = new WeakMap();
      const roomMap = Object.create(null);
      rawDirectoryData.forEach(item => {
        if (!item.roomGroup || item.roomGroup === '無-無_無' || item.roomGroup === 'NONE') return;
        if (!roomMap[item.roomGroup]) roomMap[item.roomGroup] = [];
        roomMap[item.roomGroup].push(item.name);
      });

      rawDirectoryData.forEach(item => {
        if (item.name === '杜志峰') {
          item.roommates = '無';
          return;
        }
        if (!item.roomGroup || item.roomGroup === '無-無_無' || item.roomGroup === 'NONE') {
          item.roommates = '無';
          return;
        }

        const mates = (roomMap[item.roomGroup] || []).filter(n => n !== item.name);
        item.roommates = mates.length > 0 ? mates.join(', ') : '無';
      });
    }

          </tr>

    function getScheduleRowBg(date, startTime) {
      if (String(date).includes('30')) return 'bg-rose-50/50 hover:bg-rose-100/50';
      const is1031 = String(date).includes('31');
      let hour = 0;
      if (startTime) {
        const parts = startTime.split(':');
        hour = parseInt(parts[0], 10) || 0;
      }
      const isBeforeNoon = hour < 12;

      // 暖粉紅、暖珊瑚、粉橘交織
      if (is1031) {
        return isBeforeNoon ? 'bg-pink-50/80 hover:bg-pink-100/70' : 'bg-rose-100/60 hover:bg-rose-100/90';
      } else {
        return isBeforeNoon ? 'bg-orange-50/80 hover:bg-orange-100/70' : 'bg-amber-50/80 hover:bg-amber-100/70';
      }
    }

    function formatScheduleNote(text) {
      if (!text) return '<span class="text-rose-300">-</span>';
      const lines = text.split('\n');
      
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';

        const hasAdminSupport = trimmed.includes('需行政支援');
        let renderedText = escapeHtml(trimmed);

        let levelClass = '';
        if (trimmed.startsWith('---')) {
          levelClass = 'bullet-level-3';
          renderedText = escapeHtml(trimmed.replace(/^---+/, '').trim());
        } else if (trimmed.startsWith('--')) {
          levelClass = 'bullet-level-2';
          renderedText = escapeHtml(trimmed.replace(/^--+/, '').trim());
        } else if (trimmed.startsWith('-')) {
          levelClass = 'bullet-level-1';
          renderedText = escapeHtml(trimmed.replace(/^-+/, '').trim());
        }

        if (hasAdminSupport) {
          return `<div class="${levelClass} admin-support-item flex items-center space-x-1.5"><span class="icon-circle w-5 h-5 bg-rose-200 text-rose-700 mr-1"><i class="fa-solid fa-bell text-[10px]"></i></span><span>${renderedText}</span></div>`;
        }

        return `<div class="${levelClass}">${renderedText}</div>`;
      }).join('');
    }

      if (rest.includes('麵五三')) return '<span class="icon-circle w-6 h-6 bg-amber-200/80 text-amber-800"><i class="fa-solid fa-bowl-food text-xs"></i></span>';
      if (rest.includes('植田')) return '<span class="icon-circle w-6 h-6 bg-orange-200/80 text-orange-800"><i class="fa-solid fa-fish text-xs"></i></span>';
      if (rest.includes('弎食')) return '<span class="icon-circle w-6 h-6 bg-rose-200/80 text-rose-800"><i class="fa-solid fa-fire-burner text-xs"></i></span>';
      if (rest.includes('湫禾')) return '<span class="icon-circle w-6 h-6 bg-pink-200/80 text-pink-800"><i class="fa-solid fa-plate-wheat text-xs"></i></span>';
      return '<span class="icon-circle w-6 h-6 bg-rose-100 text-rose-700"><i class="fa-solid fa-utensils text-xs"></i></span>';
    }

    /* --- [分頁5] 重啟-住宿服務 --- */
    function renderLodgingTab(thead, tbody, countBadge) {
      const view = document.getElementById('lodgingRoomView');
      const matched = getProcessedDirectoryList().filter(i => i.name !== '彭偉峰');
      const roomKey = item => item.roomGroup && !['無-無_無', 'NONE'].includes(item.roomGroup)
        ? JSON.stringify([item.hotel, item.roomGroup]) : JSON.stringify([item.hotel, item.roomType, item.name]);
      const allRooms = new Map();
      rawDirectoryData.filter(i => i.name !== '彭偉峰').forEach(item => {
        const key = roomKey(item);
        if (!allRooms.has(key)) allRooms.set(key, []);
        allRooms.get(key).push(item);
      });
      const visibleRooms = new Map();
      const matchedPeople = new Set(matched);
      matched.forEach(item => {
        const key = roomKey(item);
        if (!visibleRooms.has(key)) visibleRooms.set(key, allRooms.get(key));
      });
      const residents = Array.from(visibleRooms.values()).reduce((sum, room) => sum + room.length, 0);
      countBadge.textContent = `共 ${visibleRooms.size} 間房・${residents} 位住宿人員`;
      const controls = [['住宿飯店', 'hotel'], ['房型', 'roomType'], ['姓名', 'name'], ['同房室友', 'roommates']].map(([title, key]) => {
        const selected = columnFilters[key] && columnFilters[key].size > 0;
        return `<button type="button" onclick="openFilterModal('${key}', '${title}', event)">${title}${selected ? ' · 已篩選' : ''}${activeSortColumn === key ? (activeSortDirection === 'asc' ? ' ↑' : ' ↓') : ' ▾'}</button>`;
      }).join('');
      const hotels = new Map();
      visibleRooms.forEach(room => {
        const hotel = room[0].hotel || '未指定飯店';
        if (!hotels.has(hotel)) hotels.set(hotel, []);
        hotels.get(hotel).push(room);
      });
      view.innerHTML = `<div class="room-toolbar no-print">${controls}</div>
        <p class="room-help">移入房間看大家揮手，手機可點一下。搜尋會顯示整間房的完整名單。分組編號為資料中的住宿分組，並非飯店實際房號。</p>` +
        (hotels.size ? Array.from(hotels, ([hotel, rooms]) => {
          const hotelName = hotel === '知達' ? '知達工藝會館' : hotel === '正巧' ? '正巧文旅' : hotel;
          return `<section class="hotel-section"><h2 class="hotel-title">${escapeHtml(hotelName)} <small>${rooms.length} 間房</small></h2><div class="rooms-grid">${rooms.map(room => {
            const first = room[0];
            const groupMatch = (first.roomGroup || '').match(/_(.+)$/);
            const groupLabel = groupMatch ? `住宿分組 ${groupMatch[1]}` : '住宿分組待確認';
            const names = room.map(person => `<li class="${searchQuery && matchedPeople.has(person) ? 'matched' : ''}">${escapeHtml(person.name)}${person.name === '杜志峰' ? '<span class="contact">知達聯絡人</span>' : person.name === '吳緁苓' ? '<span class="contact">正巧聯絡人</span>' : ''}</li>`).join('');
            return `<article class="room-card ${hotel.includes('正巧') ? 'hotel-orange' : ''}" tabindex="0" role="button" aria-pressed="false" aria-label="${escapeHtml(hotelName)}，${escapeHtml(first.roomType)}，${escapeHtml(groupLabel)}，${room.length} 位：${escapeHtml(room.map(p => p.name).join('、'))}" onclick="toggleRoomGreeting(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleRoomGreeting(this)}">
              <div class="room-sign">${escapeHtml(hotelName)}<span>${escapeHtml(first.roomType || '房型待確認')}</span></div>
              <div class="room-facade"><div class="room-group-label">${escapeHtml(groupLabel)}</div><div class="room-door-area"><div class="room-door" aria-hidden="true"><div class="room-door-window"></div></div><div class="room-roster"><div class="room-roster-title">住宿人員 · ${room.length} 位</div><ul>${names}</ul></div></div></div>
              <div class="room-people" aria-hidden="true">${room.map((person, idx) => renderWavingPerson(idx)).join('')}</div><div class="room-foot">${room.length} 位入住 · 歡迎回房休息</div>
            </article>`;
          }).join('')}</div></section>`;
        }).join('') : '<div class="room-empty">無符合的住宿資料</div>');
    }

    function toggleRoomGreeting(card) {
      const open = card.classList.toggle('is-open');
      card.setAttribute('aria-pressed', String(open));
    }

    function renderWavingPerson(index) {
      const colors = ['#f43f5e', '#f97316', '#8b5cf6', '#14b8a6', '#3b82f6'];
      return `<svg class="room-person" style="--person-index:${index}" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="76" rx="15" ry="3" fill="#88133712"/>
        <path d="M26 57 L24 73 M38 57 L40 73" stroke="#713f3f" stroke-width="7" stroke-linecap="round"/>
        <path d="M23 35 Q32 29 41 35 L42 59 L22 59 Z" fill="${colors[index % colors.length]}"/>
        <path d="M24 38 L15 53" stroke="#f4bb92" stroke-width="6" stroke-linecap="round"/>
        <g class="room-hand"><path d="M40 38 L50 29 L52 13" fill="none" stroke="#f4bb92" stroke-width="6" stroke-linecap="round"/><path d="M52 15 L47 9 M52 15 L52 6 M53 15 L58 9" stroke="#f4bb92" stroke-width="3" stroke-linecap="round"/></g>
        <circle cx="32" cy="20" r="12" fill="#f4bb92"/><path d="M20 19 Q19 5 32 6 Q45 5 44 19 L39 12 Q31 16 24 12 Z" fill="#713f3f"/>
        <circle cx="28" cy="20" r="1.3" fill="#713f3f"/><circle cx="36" cy="20" r="1.3" fill="#713f3f"/><path d="M28 25 Q32 29 36 25" fill="none" stroke="#a34a46" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
    }

    function getLodgingComboBgClass(hotel, roomType) {
      const combo = `${hotel}-${roomType}`;
      if (combo.includes('正巧-4人')) return 'bg-orange-50/70 hover:bg-orange-100/60';
      if (combo.includes('正巧-2人')) return 'bg-rose-50/70 hover:bg-rose-100/60';
      if (combo.includes('知達-2人')) return 'bg-pink-50/70 hover:bg-pink-100/60';
      return 'bg-white hover:bg-rose-50/40';
    }

    /* 將原本的綠色方塊人名改為精緻暖橘粉色人名徽章 */
    function renderRoommateChips(roommatesStr) {
      if (!roommatesStr || roommatesStr === '無') {
        return `<span class="text-rose-300 text-sm">無</span>`;
      }
      if (roommatesStr === '家人') {
        return `<span class="inline-flex items-center bg-orange-100 text-orange-900 text-sm px-3 py-1 rounded-full font-bold border border-orange-300"><span class="icon-circle w-4 h-4 bg-orange-200 text-orange-700 mr-1.5"><i class="fa-solid fa-house-chimney-user text-[10px]"></i></span>家人</span>`;
      }

      const names = roommatesStr.split(/[,、]/).map(n => n.trim()).filter(Boolean);
      return `
        <div class="flex flex-wrap gap-2">
          ${names.map(name => `
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-rose-100 text-rose-900 border border-rose-300">
              <span class="icon-circle w-4 h-4 bg-rose-200 text-rose-700 mr-1.5"><i class="fa-solid fa-user text-[10px]"></i></span>
              ${escapeHtml(name)}
            </span>
          `).join('')}
        </div>
      `;
    }

    /* =========================================================
       6. 排序與表頭過濾邏輯
       ========================================================= */
    function renderHeaderTh(colTitle, colKey, widthClass) {
      const hasFilter = columnFilters[colKey] && columnFilters[colKey].size > 0;
      const isSorted = activeSortColumn === colKey;
      let sortIcon = 'fa-solid fa-arrow-down-up-across-line text-rose-300';
      if (isSorted) {
        sortIcon = activeSortDirection === 'asc' 
          ? 'fa-solid fa-arrow-up-short-wide text-rose-600' 
          : 'fa-solid fa-arrow-down-wide-short text-rose-600';
      }

      return `
        <th class="py-3.5 px-3 font-semibold ${widthClass}">
          <div class="flex items-center justify-between group">
            <span class="text-rose-950">${colTitle}</span>
            <button onclick="openFilterModal('${colKey}', '${colTitle}', event)" class="p-1 rounded-full hover:bg-rose-200/80 transition-colors">
              <span class="icon-circle w-6 h-6 bg-rose-200/70 text-rose-700 ${hasFilter ? 'bg-rose-300 text-rose-900' : ''}">
                <i class="${sortIcon} text-xs"></i>
              </span>
            </button>
          </div>
        </th>
      `;
    }

    function getProcessedDirectoryList() {
      let list = [...rawDirectoryData];

      if (searchQuery) {
        list = list.filter(item => {
          const rowText = getSearchText(item, 'directory');
          return rowText.includes(searchQuery);
        });
      }

      const activeFilters = Object.entries(columnFilters).filter(([, set]) => set && set.size > 0);
      if (activeFilters.length) {
        list = list.filter(item => activeFilters.every(([key, set]) => set.has(getColumnValue(item, key))));
      }

      const strokeSort = (a, b) => strokeCollator.compare(a || '', b || '');

      if (activeSortColumn && activeSortDirection) {
        list.sort((a, b) => {
          const valA = getColumnValue(a, activeSortColumn);
          const valB = getColumnValue(b, activeSortColumn);
          const res = strokeSort(valA, valB);
          return activeSortDirection === 'asc' ? res : -res;
        });
      } else {
        if (currentTab === 'overview') {
          const teamOrder = { '白': 1, '紅': 2, '綠': 3, '接班人': 4 };
          list.sort((a, b) => {
            const tA = teamOrder[a.team] || 99;
            const tB = teamOrder[b.team] || 99;
            if (tA !== tB) return tA - tB;
            if (a.restaurant !== b.restaurant) return strokeSort(a.restaurant, b.restaurant);
            const comboA = `${a.hotel}-${a.roomType}`;
            const comboB = `${b.hotel}-${b.roomType}`;
            if (comboA !== comboB) return strokeSort(comboA, comboB);
            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'traffic') {
          list.sort((a, b) => {
            if (a.isTrafficLeader === '是' && b.isTrafficLeader !== '是') return -1;
            if (a.isTrafficLeader !== '是' && b.isTrafficLeader === '是') return 1;
            const tRank = { '遊覽車': 1, '開車': 2, '自處': 3, '自行': 3, '高鐵': 4 };
            const outA = tRank[a.trafficOut] || 99;
            const outB = tRank[b.trafficOut] || 99;
            if (outA !== outB) return outA - outB;
            const backA = tRank[a.trafficBack] || 99;
            const backB = tRank[b.trafficBack] || 99;
            if (backA !== backB) return backA - backB;
            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'dining') {
          list.sort((a, b) => {
            if (a.restaurant !== b.restaurant) return strokeSort(a.restaurant, b.restaurant);
            if (a.isDiningLeader === '是' && b.isDiningLeader !== '是') return -1;
            if (a.isDiningLeader !== '是' && b.isDiningLeader === '是') return 1;

            const tMethodRank = (t) => {
              if (t === '遊覽車' || t === '自處' || t === '自行') return 1;
              if (t === '開車' || t === '自駕') return 2;
              return 3;
            };
            const rankA = tMethodRank(a.trafficOut);
            const rankB = tMethodRank(b.trafficOut);
            if (rankA !== rankB) return rankA - rankB;

            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'lodging') {
          const getLodgingRank = (item) => {
            if (item.hotel.includes('知達')) return 1;
            if (item.hotel.includes('正巧') && item.roomType.includes('4人')) return 2;
            if (item.hotel.includes('正巧') && item.roomType.includes('2人')) return 3;
            return 4;
          };

          list.sort((a, b) => {
            const rankA = getLodgingRank(a);
            const rankB = getLodgingRank(b);
            if (rankA !== rankB) return rankA - rankB;
            if (a.roomGroup !== b.roomGroup) return strokeSort(a.roomGroup, b.roomGroup);
            return strokeSort(a.name, b.name);
          });
        }
      }

      return list;
    }

    function getColumnValue(item, colKey) {
      if (colKey === 'trafficCombo') return `${item.trafficOut}/${item.trafficBack}`;
      if (colKey === 'lodgingCombo') return `${item.hotel}-${item.roomType}`;
      return item[colKey] || '';
    }

    /* --- 篩選彈窗控制 --- */
    function openFilterModal(colKey, colTitle, event) {
      event.stopPropagation();
      activeFilterColumn = colKey;
      document.getElementById('modalColumnTitle').textContent = `${colTitle} 篩選`;

      const modal = document.getElementById('filterDropdownModal');
      const overlay = document.getElementById('filterModalOverlay');

      const rect = event.currentTarget.getBoundingClientRect();
      const modalW = 320;
      let leftPos = rect.left - 120;
      if (leftPos + modalW > window.innerWidth - 10) leftPos = window.innerWidth - modalW - 10;
      if (leftPos < 10) leftPos = 10;
      
      modal.style.top = `${Math.min(rect.bottom + 8, window.innerHeight - 380)}px`;
      modal.style.left = `${leftPos}px`;

      renderFilterCheckboxes('');
      document.getElementById('filterValueSearch').value = '';

      overlay.classList.remove('hidden');
      modal.classList.remove('hidden');
    }

    function closeFilterModal() {
      document.getElementById('filterDropdownModal').classList.add('hidden');
      document.getElementById('filterModalOverlay').classList.add('hidden');
    }

    function renderFilterCheckboxes(searchTerm) {
      if (!activeFilterColumn) return;
      const listContainer = document.getElementById('filterCheckboxList');
      
      const allVals = Array.from(new Set(rawDirectoryData.map(i => getColumnValue(i, activeFilterColumn)))).filter(Boolean);
      const currentSelected = columnFilters[activeFilterColumn] || new Set(allVals);

      const normalizedTerm = searchTerm.toLowerCase();
      const filteredVals = allVals.filter(v => !normalizedTerm || v.toLowerCase().includes(normalizedTerm));

      listContainer.innerHTML = filteredVals.map(val => {
        const isChecked = currentSelected.has(val);
        return `
          <label class="flex items-center space-x-2.5 py-1.5 px-1.5 rounded-lg hover:bg-rose-50 cursor-pointer">
            <input type="checkbox" value="${escapeHtml(val)}" class="filter-chk accent-rose-500 rounded w-4 h-4" ${isChecked ? 'checked' : ''}>
            <span class="truncate text-rose-950 text-sm font-medium">${escapeHtml(val)}</span>
          </label>
        `;
      }).join('');
    }

    function toggleSelectAllFilter() {
      const chks = document.querySelectorAll('.filter-chk');
      const allChecked = Array.from(chks).every(c => c.checked);
      chks.forEach(c => c.checked = !allChecked);
    }

    function confirmColumnFilter() {
      if (!activeFilterColumn) return;
      const chks = document.querySelectorAll('.filter-chk');
      const selected = new Set();
      chks.forEach(c => {
        if (c.checked) selected.add(c.value);
      });

      columnFilters[activeFilterColumn] = selected;
      closeFilterModal();
      renderCurrentTab();
    }

    function applySort(direction) {
      activeSortColumn = activeFilterColumn;
      activeSortDirection = direction;
      closeFilterModal();
      renderCurrentTab();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
